# n8n 2.47.7 queue mode: main + 2 worker(s) + Redis + Postgres, one server.
# Generated by scripts/render.rb (n8n-queue-mode-benchmark). Tested on a Selfhost.dev Projects server.
#
# - Workers are separate services (n8n-worker-1, -2, ...): to add one, copy a worker
#   block AND its runner block. (Selfhost.dev's Compose route does not accept `deploy:`/replicas.)
# - Every n8n process runs Code nodes in its own task runner: one runner per process.
# - Services are prefixed (n8n-postgres, n8n-redis) so they cannot collide with other
#   containers that share the host's network.
# - For measurement as published: n8n listens on all interfaces over plain HTTP with
#   N8N_SECURE_COOKIE=false. Anywhere reachable, put it behind a TLS proxy, set
#   N8N_SECURE_COOKIE=true and bind 127.0.0.1:5678:5678.
# - Set before the first deploy: N8N_ENCRYPTION_KEY (same everywhere, never change it),
#   POSTGRES_PASSWORD, REDIS_PASSWORD, RUNNERS_AUTH_TOKEN, N8N_PUBLIC_URL (e.g. http://<ip>:5678/).
services:
  n8n-postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: n8n
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U n8n -d n8n
      interval: 5s
      timeout: 5s
      retries: 10
  n8n-redis:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD}"
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ping | grep PONG
      interval: 5s
      timeout: 5s
      retries: 10
  n8n-main:
    image: n8nio/n8n:2.47.7
    restart: unless-stopped
    environment:
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: n8n-redis
      QUEUE_BULL_REDIS_PORT: '6379'
      QUEUE_BULL_REDIS_PASSWORD: "${REDIS_PASSWORD}"
      QUEUE_HEALTH_CHECK_ACTIVE: 'true'
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: 'true'
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: '5432'
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: "${POSTGRES_PASSWORD}"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY}"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_BROKER_PORT: '5679'
      N8N_RUNNERS_AUTH_TOKEN: "${RUNNERS_AUTH_TOKEN}"
      N8N_EDITOR_BASE_URL: "${N8N_PUBLIC_URL}"
      N8N_WEBHOOK_URL: "${N8N_PUBLIC_URL}"
      N8N_SECURE_COOKIE: 'false'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '168'
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      N8N_DIAGNOSTICS_ENABLED: 'false'
    ports:
    - 5678:5678
    volumes:
    - n8n-main-data:/home/node/.n8n
    depends_on:
      n8n-postgres:
        condition: service_healthy
      n8n-redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:5678/healthz/readiness
      interval: 10s
      timeout: 10s
      retries: 30
  runner-main:
    image: n8nio/runners:2.47.7
    restart: unless-stopped
    environment:
      N8N_RUNNERS_AUTH_TOKEN: "${RUNNERS_AUTH_TOKEN}"
      N8N_RUNNERS_MAX_CONCURRENCY: '5'
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: '15'
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-main:5679
    depends_on:
    - n8n-main
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:5680/healthz
      interval: 10s
      timeout: 10s
      retries: 10
  n8n-worker-1:
    image: n8nio/n8n:2.47.7
    restart: unless-stopped
    command: worker --concurrency=10
    environment:
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: n8n-redis
      QUEUE_BULL_REDIS_PORT: '6379'
      QUEUE_BULL_REDIS_PASSWORD: "${REDIS_PASSWORD}"
      QUEUE_HEALTH_CHECK_ACTIVE: 'true'
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: 'true'
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: '5432'
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: "${POSTGRES_PASSWORD}"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY}"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_BROKER_PORT: '5679'
      N8N_RUNNERS_AUTH_TOKEN: "${RUNNERS_AUTH_TOKEN}"
      N8N_EDITOR_BASE_URL: "${N8N_PUBLIC_URL}"
      N8N_WEBHOOK_URL: "${N8N_PUBLIC_URL}"
      N8N_SECURE_COOKIE: 'false'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '168'
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      N8N_DIAGNOSTICS_ENABLED: 'false'
    depends_on:
      n8n-main:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:5678/healthz
      interval: 10s
      timeout: 10s
      retries: 10
    stop_grace_period: 60s
  runner-worker-1:
    image: n8nio/runners:2.47.7
    restart: unless-stopped
    environment:
      N8N_RUNNERS_AUTH_TOKEN: "${RUNNERS_AUTH_TOKEN}"
      N8N_RUNNERS_MAX_CONCURRENCY: '5'
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: '15'
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker-1:5679
    depends_on:
    - n8n-worker-1
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:5680/healthz
      interval: 10s
      timeout: 10s
      retries: 10
  n8n-worker-2:
    image: n8nio/n8n:2.47.7
    restart: unless-stopped
    command: worker --concurrency=10
    environment:
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: n8n-redis
      QUEUE_BULL_REDIS_PORT: '6379'
      QUEUE_BULL_REDIS_PASSWORD: "${REDIS_PASSWORD}"
      QUEUE_HEALTH_CHECK_ACTIVE: 'true'
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: 'true'
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: '5432'
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: "${POSTGRES_PASSWORD}"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY}"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_BROKER_PORT: '5679'
      N8N_RUNNERS_AUTH_TOKEN: "${RUNNERS_AUTH_TOKEN}"
      N8N_EDITOR_BASE_URL: "${N8N_PUBLIC_URL}"
      N8N_WEBHOOK_URL: "${N8N_PUBLIC_URL}"
      N8N_SECURE_COOKIE: 'false'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '168'
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      N8N_DIAGNOSTICS_ENABLED: 'false'
    depends_on:
      n8n-main:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:5678/healthz
      interval: 10s
      timeout: 10s
      retries: 10
    stop_grace_period: 60s
  runner-worker-2:
    image: n8nio/runners:2.47.7
    restart: unless-stopped
    environment:
      N8N_RUNNERS_AUTH_TOKEN: "${RUNNERS_AUTH_TOKEN}"
      N8N_RUNNERS_MAX_CONCURRENCY: '5'
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: '15'
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker-2:5679
    depends_on:
    - n8n-worker-2
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:5680/healthz
      interval: 10s
      timeout: 10s
      retries: 10
volumes:
  postgres-data:
  n8n-main-data:
  redis-data:
